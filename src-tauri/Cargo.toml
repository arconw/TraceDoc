[package]
name = "tracedoc"
version = "0.1.0"
description = "A local-first desktop documentation tool"
authors = ["TraceDoc contributors"]
edition = "2021"

[lib]
name = "tracedoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
libc = "0.2"
notify = "8"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
xattr = "1"
