[package]
name = "tracedoc"
version = "0.1.0"
description = "A local-first desktop documentation tool"
authors = ["TraceDoc contributors"]
edition = "2021"

[lib]
name = "tracedoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
